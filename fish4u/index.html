<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="screen-orientation" content="landscape">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c5c8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fish4U</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--ink:#123247;--muted:#5b7d93;--card:#fffdf6;--line:#e3edf2;--accent:#ff8a3d;--blue:#1597d4;--gold:#ffc83d}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#0a5a86;overscroll-behavior:none}
body{position:fixed;inset:0}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;height:100vh;height:100dvh;width:100vw;margin:0 auto;overflow:hidden;touch-action:none}
@media (orientation:portrait){#app{position:absolute;top:0;left:0;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;left:0;right:0;top:max(6px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;padding:0 12px;z-index:3;pointer-events:none}
.top>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px 6px 6px;font-weight:900;font-size:17px;
  box-shadow:0 3px 0 rgba(0,0,0,.15);font-variant-numeric:tabular-nums}
.pill i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#ffc83d 55%,#d99a10);display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.pill.b i{background:radial-gradient(circle at 35% 35%,#bfe9ff,#4ab4ee 60%,#1a7ab5)}
.home{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.92);display:grid;place-items:center;text-decoration:none;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.lvl{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 10px 4px 4px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.lvl b{width:26px;height:26px;border-radius:50%;background:linear-gradient(#ffd96a,#ff9f1a);display:grid;place-items:center;font-size:13px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.lvl .lb{width:64px;height:8px;border-radius:9px;background:#dbe7ee;overflow:hidden}.lvl .lb i{display:block;height:100%;background:#3fd0ff}
.badge2{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e8202a;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 4px;font-style:normal}
.sea{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);border-radius:999px;padding:3px;font-weight:900;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.15)}.sea button{width:28px;height:28px;border:0;border-radius:50%;background:#e3edf2;font-size:11px}
.dock .sep{width:10px;flex:none}
.title{flex:1;text-align:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.title em{font-style:normal;color:var(--gold)}
.dock{position:absolute;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;padding:0 10px;z-index:3}
.dock button{flex:1;min-width:0;max-width:78px;height:56px;border:0;border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 4px 0 rgba(0,0,0,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;font-size:11.5px;color:var(--ink)}
.dock button span{font-size:24px;line-height:1}
.dock button span img{width:34px;height:34px;display:block;object-fit:contain}
.home img{width:30px;height:30px;display:block;object-fit:contain}
.pill img.pi{width:26px;height:26px;object-fit:contain;display:block}
.item .uiimg{width:34px;height:34px;object-fit:contain;display:block;margin:0 auto}
.dock button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.dock button.on{background:var(--gold)}
.dock .badge{position:absolute;margin:-40px 0 0 40px;background:#e8202a;color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:6;background:rgba(18,50,71,.92);color:#fff;font-weight:900;padding:10px 18px;border-radius:999px;
  white-space:nowrap;animation:toast 2.2s ease forwards;pointer-events:none;font-size:15px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
/* sheet */
#modal{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(4,30,48,.45);opacity:0;pointer-events:none;transition:opacity .2s}
#modal.open{opacity:1;pointer-events:auto}
.sheet{width:min(94%,700px);margin:0 auto;max-height:94%;overflow:auto;background:var(--card);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:12px 16px 14px;
  transform:scale(.94);transition:transform .25s cubic-bezier(.3,1.3,.6,1)}
#modal.open .sheet{transform:none}
.sheet h2{margin:0;font-size:19px;font-weight:900}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.x{width:32px;height:32px;border:0;border-radius:50%;background:var(--line);font-weight:900;font-size:16px}
.sheet p{margin:3px 0 7px;color:var(--muted);font-size:13.5px;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.item{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 6px;text-align:center;font-weight:800;font-size:12.5px;position:relative}
.sheet canvas{position:static;inset:auto}
.item canvas{position:static;width:100%;height:auto;aspect-ratio:1.3}
.item .pr{display:inline-flex;align-items:center;gap:3px;margin-top:4px;color:#b27a00;font-weight:900}
.item .pr i{width:12px;height:12px;border-radius:50%;background:#ffc83d;display:inline-block}
.item.sel{border-color:var(--accent);background:#fff4ea}
.item.dis{opacity:.45}
.item .tag{position:absolute;top:4px;left:4px;font-size:9.5px;padding:1px 5px;border-radius:6px;color:#fff;font-weight:900}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:42px;border:0;border-radius:15px;background:var(--line);font-weight:900;font-size:15px;margin-top:8px}
.btn.p{background:linear-gradient(180deg,#ffa25c,#ff7a1a);color:#fff;box-shadow:0 4px 0 #c45608}
.btn:disabled{opacity:.45}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin:3px 0 7px}.bar i{display:block;height:100%;border-radius:99px}
.kv{display:flex;justify-content:space-between;font-weight:800;font-size:13.5px;color:var(--muted)}
.big{display:block;height:calc(var(--ah,390px)*.36);width:auto;max-width:100%;margin:0 auto;aspect-ratio:1.4}
.two{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:center}
.mid{height:calc(var(--ah,390px)*.24)!important;width:auto!important;max-width:100%;aspect-ratio:1.2;display:block;margin:0 auto}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nmenu .hd{margin-bottom:12px}
.ngrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nitem{appearance:none;display:flex;align-items:center;gap:12px;min-height:58px;border:1px solid #dbe5ea;border-radius:12px;background:#fff;padding:12px;color:#17384a;font:600 14px system-ui,-apple-system,sans-serif;text-align:left;cursor:pointer}
.nitem svg{width:32px;height:32px;flex:none}.nitem .nimg{width:38px;height:38px;flex:none;object-fit:contain;display:block}
.nitem:active{background:#e6f0f5}
.nitem:focus-visible,.x:focus-visible{outline:3px solid #2682a9;outline-offset:3px}
@media (max-width:650px) and (orientation:landscape){.ngrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.help2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}.help2 p{font-size:12.5px!important;margin:2px 0!important}
.r0{background:#8aa4b4}.r1{background:#3fb06a}.r2{background:#2f8be0}.r3{background:#a24ae0}.r4{background:linear-gradient(90deg,#ff5f6d,#ffc371,#3fd0a0,#4a9cff,#b25cff)}
.rt{display:inline-block;color:#fff;font-weight:900;font-size:12px;padding:3px 10px;border-radius:99px}
.new{display:inline-block;background:#e8202a;color:#fff;font-weight:900;font-size:12px;padding:3px 10px;border-radius:99px;margin-left:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;height:36px;border:0;border-radius:11px;background:var(--line);font-weight:900;font-size:13px}.tabs button.on{background:var(--ink);color:#fff}
.reveal{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.3);opacity:0}}
/* liggend: knoppen buiten de inkeping houden */
.top{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
/* telefoon rechtop (spel gedraaid): links van het spel = statusbalk, rechts = thuisbalk */
@media (orientation:portrait){.top{top:6px;padding-left:calc(env(safe-area-inset-top) + 14px);padding-right:calc(env(safe-area-inset-bottom) + 12px + var(--xr,0px))}.dock{bottom:6px;padding-right:calc(10px + var(--xr,0px))}}
@media (orientation:landscape){.dock{bottom:calc(max(6px,env(safe-area-inset-bottom)) + var(--xb,0px))}}
.tchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:4px;margin-bottom:4px}
.tchip{appearance:none;border:1px solid #dbe5ea;background:#fff;border-radius:10px;padding:2px 4px;justify-content:center;display:flex;align-items:center;gap:3px;font:800 11px system-ui;color:#17384a;cursor:pointer}
.tchip.on{border-color:#ff8a3d;background:#fff4ea}.tchip.done b{color:#2f9a5a}.tchip canvas{width:34px;height:22px;display:block}
.thead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:2px 0 4px}.thead b{font-size:16px}.thead span{font-size:12px;color:var(--muted);font-weight:700}.thead .tall{margin-left:auto}
.tree{position:relative;display:grid;grid-template-columns:1fr 1fr 1.25fr;height:min(250px,calc(var(--ah,390px) - 150px))}
.tlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.tlines path{fill:none;stroke:#b9d3df;stroke-width:2;vector-effect:non-scaling-stroke}
.tcol{position:relative;display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.tnode{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.92);border:1px solid #dbe5ea;border-radius:12px;padding:2px 8px 3px;min-width:96px;text-align:center}
.tnode canvas{display:block}.tnode .tn{font-size:11.5px;font-weight:900;line-height:1.1}.tnode .rt{font-size:9.5px;padding:0 6px}
.tnode.unk{background:#eef3f6}.tnode .tq{font-size:9.5px;color:var(--muted);font-weight:700;max-width:110px;line-height:1.1}
.tcol:nth-child(4) .tnode{flex-direction:row;gap:6px;padding:1px 8px;text-align:left;width:94%;min-width:0}.tcol:nth-child(4) .tnode>div,.tcol:nth-child(4) .tnode>span{display:block}
.asum{font-size:12px;font-weight:700;color:var(--muted);margin-left:8px}
.atabs{display:flex;gap:3px;margin-bottom:6px;flex-wrap:wrap}.atab{position:relative;appearance:none;border:1px solid #dbe5ea;background:#fff;border-radius:999px;padding:3px 7px;font:800 11px system-ui;color:#17384a;cursor:pointer}
.atab.on{background:#17384a;color:#fff;border-color:#17384a}.atab small{opacity:.7;font-weight:700}
.alist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.ach{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #dbe5ea;border-radius:12px;padding:4px 7px;min-height:46px}
.ach.rd{border-color:#3fb06a;background:#effaf2}.ach.cl{opacity:.6}
.aic{width:32px;height:32px;flex:none;object-fit:contain;display:grid;place-items:center}.aic.e{font-size:22px}
.am{flex:1;min-width:0}.am b{display:block;font-size:12px;line-height:1.15}.am small{display:block;font-size:10px;color:var(--muted);font-weight:700;line-height:1.2}.am .bar{margin:3px 0 0;height:6px}
.ar{flex:none;text-align:right}.ar .btn{width:auto;height:30px;margin:0;padding:0 8px;font-size:13px}.ar .pp{font-size:10.5px;font-weight:800;color:var(--muted)}.ar .ok{color:#2f9a5a;font-weight:900;font-size:18px}
@media (max-width:620px){.alist{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="top">
    <a class="home" href="../" aria-label="Home" title="Alle spellen" data-ic2="home">🏠</a>
    <button class="home" id="bTasks" aria-label="Taken" title="Taken" style="border:0;position:relative" data-ic2="tasks">📋<span id="taskBadge" class="badge2">1</span></button>
    <div class="lvl"><b id="lvln">1</b><div class="lb"><i id="lvlbar"></i></div></div>
    <div class="pill"><i></i><span id="coins">0</span></div>
    <button class="pill b" id="bPearls" style="border:0"><i></i><span id="pearls">0</span></button>
    <div class="title">Fish<em>4U</em></div>
    <div class="sea"><button id="seaPrev">◀</button><span id="seaName">Zee 1</span><button id="seaNext">▶</button></div>
  </div>
  <div class="dock">
    <button data-tool="pointer" class="on" data-ic="pointer"><span>👆</span>Wijzer</button>
    <button data-tool="food" data-ic="food"><span>🍤</span>Voer</button>
    <button data-tool="clean" data-ic="clean"><span>🧽</span>Poetsen</button>
    <button data-tool="decor" data-ic="decor"><span>✋</span>Inrichten</button>
    <i class="sep"></i>
    <button id="bShop" data-ic="shop"><span>🛒</span>Winkel</button>
    <button id="bEvo" style="position:relative" data-ic="evolution"><span>🧬</span>Evolutie<b id="evoBadge" class="badge2" style="display:none">!</b></button>
    <button id="bMore" style="position:relative" data-ic="menu"><span>☰</span>Menu<b id="achBadge" class="badge2" style="display:none"></b></button>
  </div>
  
  <div id="modal"><div class="sheet" id="sheet"></div></div>
</div>
<script src="../shared/art.js"></script>
<script>
'use strict';
/* ================= opslag ================= */
const store={get(k,d){try{const v=localStorage.getItem('fish4u_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('fish4u_'+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= vissen: alleen de getekende pakketten (art/vis_XX*.png + vissen.json) ================= */
// een vis = familie a (0 = vis_01) + evolutiepad ('' / 'a' / 'b' / 'aa' / 'ab' / 'ba' / 'bb')
const RANK=['Gewoon','Bijzonder','Zeldzaam'];
const VALUE=[1,3,8];
const ART_FISH=[],ART_EVO=[],ART_NAMES={},DECOR_ART={},BG_ART={};
const artFile=(a,path)=>'vis_'+String(a+1).padStart(2,'0')+(path||'');
const artImg=g=>(g.path?(ART_EVO[g.a]&&ART_EVO[g.a][g.path]):ART_FISH[g.a])||null;
const total=()=>ART_FISH.length+ART_EVO.reduce((n,e)=>n+Object.keys(e||{}).length,0);
const key=g=>'A'+g.a+(g.path||'');
const rarity=g=>Math.min(2,(g.path||'').length);
const fname=g=>{const inf=ART_NAMES[artFile(g.a,g.path)];return inf&&inf.naam?inf.naam:'Vis '+artFile(g.a,g.path).slice(4);};
const fishG=(a,path)=>({a,path:path||''});

/* ================= vissen tekenen ================= */
function drawFish(x,g,cx,cy,size,phase,dir){
  const img=artImg(g);if(!img)return;
  const w=size*1.55,h=w*img.height/img.width;
  x.save();x.translate(cx,cy);x.scale(dir,1);x.rotate(Math.sin(phase*.5)*.06);x.scale(1+Math.sin(phase)*.025,1-Math.sin(phase)*.025);
  x.drawImage(img,-w/2,-h/2,w,h);x.restore();
}
function thumb(g,w,h){
  const c=document.createElement('canvas'),d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);
  drawFish(x,g,w/2,h/2+2,Math.min(w,h*1.3)*.62,0.6,1);return c;
}

/* ================= decor ================= */
const DECOR_IDS=['amethyst','kelp','coral','rock','star','shell','moss','anemone','flower','crystal','bubbler','chest','castle','spekkoek','borobudur'];
const DECOR_H={amethyst:96,borobudur:104,spekkoek:52,castle:118,chest:66,rock:46,star:40,shell:54,moss:50,anemone:68,flower:74,crystal:80,coral:80,kelp:104,bubbler:96};
const DECOR=[
  {id:'kelp',n:'Zeewier',p:15},{id:'coral',n:'Koraal',p:30},{id:'rock',n:'Rotsen',p:20},{id:'star',n:'Zeester',p:25},
  {id:'shell',n:'Schelp',p:40},{id:'moss',n:'Mosbal',p:35},{id:'anemone',n:'Anemoon',p:70},{id:'flower',n:'Zeebloem',p:80},{id:'crystal',n:'Kristallen',p:150},{id:'amethyst',n:'Amethistgeode',p:180},{id:'bubbler',n:'Bubbelsteen',p:60},{id:'chest',n:'Schatkist',p:120},{id:'castle',n:'Kasteel',p:200},{id:'spekkoek',n:'Spekkoek',p:60},{id:'borobudur',n:'Borobudur',p:300},
];
function drawDecor(x,d,t,X,Y,s){
  const im=DECOR_ART[d];if(!im)return;s=s||1;
  const h=(DECOR_H[d]||80)*s*(x===cx?Math.min(1.25,Math.max(.8,H/420)):1),w=h*im.width/im.height;x.drawImage(im,X-w/2,Y-h,w,h);
}

/* ================= instelbare waarden (niet vastgelegd in de bron – vrij aan te passen) ================= */
const CFG={
  maxFish:12,            // vissen per zee
  evoTime:[180,600],     // wachttijd evolutie in seconden: van basis -> vorm 1, vorm 1 -> vorm 2
  evoCost:[40,120],      // munten per evolutie
  skipPearls:5,          // parels om een evolutie direct af te ronden
  dirtEvery:45,          // elke ~45 s een vuilplek (ook als de app dicht is)
  dirtMax:24,
  coinEvery:22,          // seconden tussen munten van een tevreden volwassen vis
  jackpotCost:10,
  seas:[{n:'Zee 1',lvl:1,p:0},{n:'Zee 2',lvl:4,p:300},{n:'Zee 3',lvl:8,p:900},{n:'Zee 4',lvl:12,p:2000},{n:'Zee 5',lvl:16,p:4000},{n:'Zee 6',lvl:20,p:8000}],
};
const lvlXP=l=>Math.round(40*Math.pow(l,1.45));

/* ================= winkelcatalogus ================= */
function catalogFish(){
  return ART_FISH.map((_,k)=>({g:fishG(k,''),lvl:[1,1,2,3,4,5,6][k]||(k),p:[20,30,45,60,80,100,130][k]||(100+k*25)})).filter(Boolean);
}
const DECOR_LVL={amethyst:7,spekkoek:3,borobudur:9,kelp:1,rock:1,star:2,coral:2,shell:3,moss:3,anemone:4,flower:5,bubbler:6,crystal:7,chest:8,castle:10};
const BG_LVL={reef:1,lagoon:3,wreck:6,cave:9};

/* ================= evolutie: één vis -> één van twee getekende vormen ================= */
function evoOptions(f){
  const p=f.g.path||'';if(p.length>=2||!adult(f))return null;
  const E=ART_EVO[f.g.a]||{};
  if(E[p+'a']&&E[p+'b'])return ['a','b'].map(k=>fishG(f.g.a,p+k));
  return null;
}

/* ================= staat ================= */
function mkFish(g,adultNow){return {id:Math.random().toString(36).slice(2,9),g,grow:adultNow?6:0,hunger:30,tier:0,born:Date.now()};}
function newTank(bgId){return {fish:[],decor:[],bg:bgId||'reef',dirt:[]};}
function newState(){
  const t=newTank();t.fish=[mkFish(fishG(0,''),true),mkFish(fishG(1,''),false)];
  t.decor=[{id:'kelp',x:.18},{id:'rock',x:.78}];
  return {fresh:true,v:2,coins:60,pearls:5,xp:0,lvl:1,tanks:[t],cur:0,bgs:['reef'],disc:{},ever:{},evo:null,tasks:[],stats:{evolved:0,cleaned:0,fed:0},sound:true,last:Date.now(),jackDay:''};
}

const cv=$('cv'),cx=cv.getContext('2d'),app=$('app');
let W=360,H=640,dpr=1,SAND=560;
const rotated=()=>matchMedia('(orientation:portrait)').matches;
function pt(e){if(rotated())return {x:e.clientY,y:app.offsetHeight-e.clientX};const r=app.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
const standalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
const lvhProbe=document.createElement('div');lvhProbe.style.cssText='position:fixed;top:0;left:0;width:1px;height:100vh;height:100lvh;visibility:hidden;pointer-events:none';document.body.appendChild(lvhProbe);
let EXTRA=0;
function screenWH(){ // volledige schermmaat; het deel achter een verborgen browserbalk doet ook mee
  const vw=Math.max(innerWidth,document.documentElement.clientWidth),vh=Math.max(innerHeight,document.documentElement.clientHeight,(window.visualViewport&&visualViewport.height)||0);
  let fh=Math.max(vh,lvhProbe.offsetHeight||0),fw=vw;
  if(standalone()&&screen.width&&screen.height){const sw=Math.min(screen.width,screen.height),sh=Math.max(screen.width,screen.height);if(rotated()){fw=Math.max(fw,sw);fh=Math.max(fh,sh);}else{fw=Math.max(fw,sh);fh=Math.max(fh,sw);}}
  EXTRA=Math.max(0,Math.round(fh-vh));return [fw,fh];
}
function resize(){if(rotated()){const [w,h]=screenWH();app.style.width=h+'px';app.style.height=w+'px';}else{const [w,h]=screenWH();app.style.width=w+'px';app.style.height=h+'px';}
  app.style.setProperty('--xr',(rotated()?EXTRA:0)+'px');app.style.setProperty('--xb',(rotated()?0:EXTRA)+'px');
  dpr=Math.min(devicePixelRatio||1,2.5);W=app.offsetWidth;H=app.offsetHeight;app.style.setProperty('--ah',H+'px');cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);SAND=sandLine();}
function sandLine(){const B=BGS.find(b=>b.id===T().bg)||BGS[0],im=BG_ART[B.id];if(im){const sc=Math.max(W/im.width,H/im.height);return Math.round(H-im.height*sc*.13);}return H-(H<500?84:128);}
addEventListener('resize',()=>{resize();syncSwimmers();});addEventListener('orientationchange',()=>{setTimeout(resize,250);setTimeout(resize,800);});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>resize());
const SW=[];
function syncSwimmers(rebuild){
  if(rebuild)SW.length=0;
  for(const f of T().fish)if(!SW.find(s=>s.f===f))SW.push({f,x:40+Math.random()*(W-80),y:130+Math.random()*(SAND-230),vx:0,vy:0,tx:0,ty:0,ph:Math.random()*6,dir:1,next:0,happy:0});
  for(let i=SW.length-1;i>=0;i--)if(!T().fish.includes(SW[i].f))SW.splice(i,1);
}
const food=[],drops=[],bubbles=[],fx=[];
const sizeOf=f=>{const t=Math.min(1,f.grow/6),tier=(f.g.path||'').length;return W*[.04,.06,.095][tier]/1.55*(.7+.3*t);};
const adult=f=>f.grow>=6;
let tool='pointer';

/* ================= offline voortgang ================= */
(function offline(){
  const dt=Math.min(12*3600,(Date.now()-(S.last||Date.now()))/1000);if(dt<20)return;
  let earned=0;
  S.tanks.forEach(t=>{
    for(const f of t.fish){const before=f.hunger;f.hunger=clamp(f.hunger+dt/4,0,100);
      if(adult(f)){const fedSecs=Math.max(0,(70-before)*4);earned+=Math.floor(Math.min(dt,fedSecs)/CFG.coinEvery)*VALUE[rarity(f.g)];}}
    const nd=Math.floor(dt/CFG.dirtEvery);for(let i=0;i<nd&&t.dirt.length<CFG.dirtMax;i++)t.dirt.push(newDirt());
  });
  earned=Math.min(earned,300);S.coins+=earned;
  const mins=Math.round(dt/60);
  setTimeout(()=>toast(earned?`Terwijl je weg was (${mins<60?mins+' min':Math.round(mins/60)+' u'}): +${earned} munten`:'Welkom terug! Je vissen hebben honger 🍤'),700);
})();
function newDirt(){return {x:.05+Math.random()*.9,y:.12+Math.random()*.72,r:14+Math.random()*16,k:rnd(3)};}

let dragging=false;
app.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,a,.sheet,.pill,.lvl'))return;
  if(modalOpen())return;e.preventDefault();ensureAudio();
  const {x,y}=pt(e);
  if(tool==='clean'){dragging=true;wipe(x,y);return;}
  // munten / XP aantikken (in elke modus)
  for(let i=drops.length-1;i>=0;i--){const c=drops[i];if(Math.hypot(c.x-x,c.y-y)<28){collectDrop(i);return;}}
  if(tool==='food'){if(y<SAND-10){for(let i=0;i<3;i++)food.push({x:x+(Math.random()-.5)*26,y:Math.max(y,90)+(Math.random()-.5)*10,vy:18+Math.random()*10,t:0});sfx('plop');}return;}
  if(tool==='decor'){let bi=-1,bd=60;T().decor.forEach((d,i)=>{const dd=Math.abs(d.x*W-x);if(dd<bd&&y>SAND-100){bd=dd;bi=i;}});if(bi>=0){moving=bi;}return;}
  // wijzer: vis bekijken
  let best=null,bd=1e9;for(const s of SW){const d=Math.hypot(s.x-x,s.y-y);if(d<sizeOf(s.f)*.7+12&&d<bd){bd=d;best=s;}}
  if(best)fishInfo(best.f);
});
let moving=-1;
app.addEventListener('pointermove',e=>{
  const {x,y}=pt(e);
  if(tool==='clean'&&dragging)wipe(x,y);
  if(tool==='decor'&&moving>=0){T().decor[moving].x=clamp(x/W,.04,.96);}
});
addEventListener('pointerup',()=>{if(dragging||moving>=0)save();dragging=false;moving=-1;});
function wipe(x,y){
  const t=T();for(let i=t.dirt.length-1;i>=0;i--){const d=t.dirt[i];if(Math.hypot(d.x*W-x,d.y*H-y)<d.r+22){
    d.hp=(d.hp||3)-1;if(d.hp<=0){t.dirt.splice(i,1);S.coins+=1;S.stats.cleaned++;track('clean');addXP(2,x,y);fx.push({x,y,t:0,txt:'+1'});sfx('clean');}}}
}
function collectDrop(i){const c=drops[i];drops.splice(i,1);
  if(c.xp){addXP(c.v,c.x,c.y);sfx('xp');}else{S.coins+=c.v;track('coins',c.v);fx.push({x:c.x,y:c.y,t:0,txt:'+'+c.v});sfx('coin');}
  updTop();save();}

/* ================= update ================= */
let lastT=performance.now(),saveT=0,dirtT=0;
function update(dt){
  const t=performance.now(),tank=T();
  for(let i=food.length-1;i>=0;i--){const p=food[i];p.t+=dt;p.y=Math.min(SAND-4,p.y+p.vy*dt);p.x+=Math.sin(p.t*3+i)*.2;if(p.t>14)food.splice(i,1);}
  // honger in alle zeeën, vuil in alle zeeën
  S.tanks.forEach((tk,ti)=>{if(ti!==S.cur)for(const f of tk.fish)f.hunger=clamp(f.hunger+dt/4,0,100);});
  dirtT+=dt;if(dirtT>CFG.dirtEvery){dirtT=0;S.tanks.forEach(tk=>{if(tk.dirt.length<CFG.dirtMax)tk.dirt.push(newDirt());});}
  const dirtSlow=1+tank.dirt.length/CFG.dirtMax;
  for(const s of SW){
    const f=s.f,sz=sizeOf(f);f.hunger=clamp(f.hunger+dt/4,0,100);
    s.ph+=dt*(5+Math.hypot(s.vx,s.vy)/12);
    const evoing=S.evo&&S.evo.id===f.id;
    let target=null;
    if(!evoing&&f.hunger>15&&food.length){let bd=1e9;for(const p of food){const d=Math.hypot(p.x-s.x,p.y-s.y);if(d<bd){bd=d;target=p;}}}
    if(target){s.tx=target.x;s.ty=target.y;
      if(Math.hypot(target.x-s.x,target.y-s.y)<sz*.4){food.splice(food.indexOf(target),1);f.hunger=clamp(f.hunger-22,0,100);S.stats.fed++;track('feed');
        if(f.grow<6){f.grow++;addXP(1);if(f.grow===6){fx.push({x:s.x,y:s.y-sz,t:0,txt:'Volwassen!'});sfx('grow');addXP(5);}}s.happy=1.2;sfx('munch');}}
    else if(t>s.next){s.tx=30+Math.random()*(W-60);s.ty=110+Math.random()*(SAND-190);s.next=t+3000+Math.random()*5000;}
    const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy)||1,sp=(target?70:26)+(1-Math.min(1,f.grow/6))*10;
    s.vx+=(dx/d*sp-s.vx)*Math.min(1,dt*1.6);s.vy+=(dy/d*sp*.6-s.vy)*Math.min(1,dt*1.6);
    if(d<8){s.vx*=.9;s.vy*=.9;}
    s.x=clamp(s.x+s.vx*dt,20,W-20);s.y=clamp(s.y+s.vy*dt+Math.sin(s.ph*.3)*.15,100,SAND-sz*.4);
    if(Math.abs(s.vx)>4)s.dir=s.vx>0?1:-1;
    if(s.happy>0)s.happy-=dt;
    if(adult(f)&&f.hunger<70&&!evoing){s.coinT=(s.coinT||Math.random()*20)+dt;if(s.coinT>CFG.coinEvery*dirtSlow){s.coinT=0;
      if(drops.length<30){const xp=Math.random()<.2;drops.push({x:s.x,y:s.y,v:xp?2+(f.tier||0)*2:VALUE[rarity(f.g)],xp,vy:0,t:0});}}}
  }
  for(let i=drops.length-1;i>=0;i--){const c=drops[i];c.t+=dt;c.vy=Math.min(60,c.vy+80*dt);c.y=Math.min(SAND-6,c.y+c.vy*dt);if(c.t>45)drops.splice(i,1);}
  if(Math.random()<dt*2.5)bubbles.push({x:Math.random()*W,y:SAND,r:2+Math.random()*4,v:30+Math.random()*30});
  for(const d of tank.decor)if(d.id==='bubbler'&&Math.random()<dt*6)bubbles.push({x:d.x*W+(Math.random()-.5)*8,y:SAND-10,r:2+Math.random()*3,v:50+Math.random()*30});
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.y-=b.v*dt;b.x+=Math.sin(b.y/20)*.3;if(b.y<70)bubbles.splice(i,1);}
  for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>1.2)fx.splice(i,1);}
  // evolutie klaar?
  if(S.evo&&!S.evo.ready&&Date.now()>=S.evo.done){S.evo.ready=true;toast('🧬 Evolutie klaar! Open Evolutie');sfx('grow');updTop();}
  saveT+=dt;if(saveT>5){saveT=0;save();}
}

const BGS=[{id:'reef',n:'Blauw rif',p:0,w:['#5ad1f2','#1d9ad6','#0c5c8a'],sand:['#f6dfa6','#d8b46a'],far:'rgba(8,70,110,.45)'},
  {id:'lagoon',n:'Groene lagune',p:150,w:['#b8f0a8','#4fbf7a','#1f6e48'],sand:['#8fcf6a','#4f9a44'],far:'rgba(30,100,60,.45)'},

  {id:'cave',n:'Kristalgrot',p:400,w:['#9ad8ff','#3a7ac8','#241e5a'],sand:['#e8d9b8','#b9a27a'],far:'rgba(40,30,90,.5)'}];

function render(){

  for(const c of drops){const sp=Math.abs(Math.cos(t/250+c.x));x.save();x.translate(c.x,c.y);

    else if(!c.xp&&UIA.obj_coin){x.scale(sp*.9+.1,1);x.drawImage(UIA.obj_coin,-11,-11,22,22);}
    else if(c.xp){x.rotate(t/600);x.fillStyle='#7ff0ff';x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,r=i&1?4:9;x.lineTo(Math.cos(a)*r,Math.sin(a)*r);}x.fill();}
    else{x.scale(sp*.9+.1,1);const cg=x.createRadialGradient(-3,-3,1,0,0,9);cg.addColorStop(0,'#fff3a8');cg.addColorStop(.6,'#ffc83d');cg.addColorStop(1,'#d99a10');x.fillStyle=cg;x.beginPath();x.arc(0,0,8,0,7);x.fill();}
    x.restore();}
  const order=SW.slice().sort((a,b)=>sizeOf(a.f)-sizeOf(b.f));
  for(const s of order){const sz=sizeOf(s.f),evoing=S.evo&&S.evo.id===s.f.id;
    if(evoing){x.save();x.globalAlpha=.35+.15*Math.sin(t/300);x.fillStyle='#e9d5ff';x.beginPath();x.arc(s.x,s.y,sz*.75,0,7);x.fill();x.restore();}
    drawFish(x,s.f.g,s.x,s.y,sz,s.ph,s.dir,{blush:s.happy>0});
    if(s.f.hunger>70&&!evoing){x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.arc(s.x+s.dir*sz*.3,s.y-sz*.65,9,0,7);x.fill();x.font='11px system-ui';x.textAlign='center';x.fillText('🍤',s.x+s.dir*sz*.3,s.y-sz*.65+4);}}
  x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=1.2;for(const b of bubbles){x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.stroke();}
  // vuil op het glas
  for(const d of tank.dirt){const di=UIA['obj_dirt_'+(d.k+1)];if(di){x.globalAlpha=.45+.18*(d.hp||3);const sz=d.r*2.4;x.save();x.translate(d.x*W,d.y*H);x.rotate(d.x*20);x.drawImage(di,-sz/2,-sz/2,sz,sz);x.restore();x.globalAlpha=1;continue;}
    const a=.18+.08*(d.hp||3);x.fillStyle=['rgba(90,120,40,'+a+')','rgba(110,100,50,'+a+')','rgba(70,110,80,'+a+')'][d.k];
    x.beginPath();for(let i=0;i<9;i++){const an=i/9*Math.PI*2,rr=d.r*(.75+.25*Math.sin(i*2.3+d.x*20));x.lineTo(d.x*W+Math.cos(an)*rr,d.y*H+Math.sin(an)*rr);}x.fill();}
  for(const f of fx){x.globalAlpha=1-f.t/1.2;x.fillStyle=f.c||'#fff';x.font='900 16px system-ui';x.textAlign='center';x.strokeStyle='rgba(18,50,71,.6)';x.lineWidth=3;
    x.strokeText(f.txt,f.x,f.y-f.t*30);x.fillText(f.txt,f.x,f.y-f.t*30);x.globalAlpha=1;}
  if(!modalOpen()&&tool==='pointer'&&T().fish.some(f=>f.hunger>70)){x.fillStyle='rgba(255,255,255,.85)';x.font='800 13px system-ui';x.textAlign='center';x.fillText('Kies 🍤 Voer en tik in het water',W/2,SAND-70);}
  if(!modalOpen()&&tool==='pointer'&&tank.dirt.length>=CFG.dirtMax*.6){x.fillStyle='rgba(255,255,255,.85)';x.font='800 13px system-ui';x.textAlign='center';x.fillText('Het glas is vies – kies 🧽 Poetsen',W/2,SAND-90);}
}

addEventListener('keydown',e=>{if(!modalOpen())return;
  if(e.key==='Escape'){e.preventDefault();close();return;}
  if(e.key==='Tab'){const f=[...sheet.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled);if(!f.length)return;
    const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
modal.addEventListener('pointerdown',e=>{if(e.target===modal)close();});
const hd=t=>`<div class="hd"><h2>${t}</h2><button class="x" onclick="closeM()">✕</button></div>`;
const rt=r=>`<span class="rt r${r}">${RANK[r]}</span>`;
function mount(sel,canvases){sheet.querySelectorAll(sel).forEach((el,i)=>{if(canvases[i])el.prepend(canvases[i]);});}
function liveFish(id,g,w,h,sz){const c=$(id),d=2;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);
  const loop=()=>{if(!modalOpen()||!$(id))return;x.clearRect(0,0,w,h);drawFish(x,g,w/2,h/2+4,sz,performance.now()/160,1);requestAnimationFrame(loop);};loop();}
const lockTag=l=>`<span class="tag" style="background:#123247">🔒 Niv. ${l}</span>`;

// gereedschap
function setTool(t){tool=t;document.querySelectorAll('.dock [data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  if(t==='clean')toast('Veeg over het vuil om te poetsen');if(t==='food')toast('Tik in het water om te voeren');}
document.querySelectorAll('.dock [data-tool]').forEach(b=>b.onclick=()=>{ensureAudio();setTool(b.dataset.tool);});

// vis-info
function fishInfo(f){
  const r=rarity(f.g),val=VALUE[r]*(adult(f)?15:5)*(1+(f.tier||0));
  open(hd(fname(f.g))+`<div class="two"><div><canvas class="big" id="bigc"></canvas>
    <div style="text-align:center;margin-top:4px">${rt(r)} <span class="rt" style="background:#5b7d93">Vorm ${(f.tier||0)+1}/3</span></div></div><div>
    <div class="kv"><span>${adult(f)?'Volwassen':'Groeit nog'}</span><span>${Math.min(6,f.grow)}/6</span></div><div class="bar"><i style="width:${Math.min(1,f.grow/6)*100}%;background:#3fb06a"></i></div>
    <div class="kv"><span>Honger</span><span>${Math.round(f.hunger)}%</span></div><div class="bar"><i style="width:${f.hunger}%;background:${f.hunger>70?'#e8202a':'#ff9f43'}"></i></div>
    <p>${adult(f)?((f.tier||0)<2?'Deze vis kan evolueren via 🧬 Evolutie.':'Deze vis is volledig geëvolueerd.'):'Voer hem om te laten groeien. Volwassen vissen laten munten en XP vallen en kunnen evolueren.'}</p>
    <div class="row2"><button class="btn" onclick="sellFish('${f.id}')">Verkopen (+${val})</button>${evoOptions(f)?`<button class="btn p" onclick="evoUI('${f.id}')">Evolueren</button>`:'<button class="btn p" onclick="closeM()">Oké</button>'}</div></div></div>`);
  liveFish('bigc',f.g,280,200,150);
}
window.sellFish=id=>{const t=T();if(t.fish.length<=1){toast('Je hebt minstens één vis nodig');return;}
  if(S.evo&&S.evo.id===id){toast('Deze vis zit in de evolutie');return;}
  const f=t.fish.find(q=>q.id===id);if(!f)return;const val=VALUE[rarity(f.g)]*(adult(f)?15:5)*(1+(f.tier||0));
  t.fish.splice(t.fish.indexOf(f),1);S.coins+=val;addXP(3);syncSwimmers();updTop();save();close();sfx('coin');toast(`Verkocht: +${val}`);};

// winkel: Vissen, Decor, Thema's, Zeeën
function shop(tab){
  tab=tab||'fish';let body='';
  if(tab==='fish'){const cat=catalogFish();
    body='<div class="grid">'+cat.map((c,i)=>{const lock=S.lvl<c.lvl;return `<div class="item ${lock||S.coins<c.p?'dis':''}" onclick="buyFish(${i})">${lock?lockTag(c.lvl):`<span class="tag r${rarity(c.g)}">${RANK[rarity(c.g)]}</span>`}<div style="font-size:11px">${fname(c.g)}</div><div class="pr"><i></i>${c.p}</div></div>`;}).join('')+'</div>';}
  else if(tab==='decor')body='<div class="grid">'+DECOR.map(d=>{const l=DECOR_LVL[d.id]||1,lock=S.lvl<l;return `<div class="item ${lock||S.coins<d.p?'dis':''}" onclick="buyDecor('${d.id}')">${lock?lockTag(l):''}<canvas data-d="${d.id}" width="160" height="120" style="width:100%;aspect-ratio:1.33"></canvas>${d.n}<div class="pr"><i></i>${d.p}</div></div>`;}).join('')+'</div>';
  else if(tab==='bg')body='<div class="grid">'+BGS.map(b=>{const own=S.bgs.includes(b.id),l=BG_LVL[b.id],lock=!own&&S.lvl<l;return `<div class="item ${lock||(!own&&S.coins<b.p)?'dis':''} ${T().bg===b.id?'sel':''}" onclick="buyBg('${b.id}')">${lock?lockTag(l):''}<div style="height:62px;border-radius:10px;background:linear-gradient(${b.w[0]},${b.w[1]} 60%,${b.sand[0]} 61%)"></div>${b.n}<div class="pr">${own?'In bezit':'<i></i>'+b.p}</div></div>`;}).join('')+'</div>';
  else body='<div class="grid">'+CFG.seas.map((z,i)=>{const own=i<S.tanks.length,lock=!own&&S.lvl<z.lvl,next=i===S.tanks.length;return `<div class="item ${(!own&&(lock||!next||S.coins<z.p))?'dis':''} ${S.cur===i?'sel':''}" onclick="buySea(${i})">${lock?lockTag(z.lvl):''}<div style="font-size:34px;line-height:1.7">🌊</div>${z.n}<div class="pr">${own?'In bezit':'<i></i>'+z.p}</div></div>`;}).join('')+'</div>';
  open(hd('Winkel')+`<div class="tabs"><button class="${tab==='fish'?'on':''}" onclick="shop('fish')">Vissen</button><button class="${tab==='decor'?'on':''}" onclick="shop('decor')">Decor</button><button class="${tab==='bg'?'on':''}" onclick="shop('bg')">Thema's</button><button class="${tab==='sea'?'on':''}" onclick="shop('sea')">Zeeën</button></div>${body}
    <p style="margin-top:12px">${CFG.seas[S.cur].n}: ${T().fish.length}/${CFG.maxFish} vissen · ${T().decor.length}/10 decoraties</p>`);
  if(tab==='fish'){const cat=catalogFish();sheet.querySelectorAll('.item').forEach((el,i)=>el.insertBefore(thumb(cat[i].g,90,66),el.children[1]));}
  sheet.querySelectorAll('canvas[data-d]').forEach(c=>{const x=c.getContext('2d');x.fillStyle='#bfe8f7';x.fillRect(0,0,160,120);x.fillStyle='#f6dfa6';x.fillRect(0,96,160,24);drawDecor(x,c.dataset.d,0,80,104,1.1);});
}
window.shop=shop;
window.buyFish=i=>{const c=catalogFish()[i];if(S.lvl<c.lvl){toast('Vrij op niveau '+c.lvl);return;}if(S.coins<c.p){toast('Niet genoeg munten');return;}if(T().fish.length>=CFG.maxFish){toast('Deze zee is vol');return;}
  S.coins-=c.p;const f=mkFish(Object.assign({},c.g),false);T().fish.push(f);const k=key(f.g);if(!S.disc[k]){S.disc[k]=1;track('discover');}track('buyfish');addXP(5);
  syncSwimmers();updTop();save();close();sfx('buy');toast(fname(c.g)+' is erbij! Voer hem om te groeien');};
window.buyBg=id=>{const b=BGS.find(q=>q.id===id);if(!S.bgs.includes(id)){if(S.lvl<BG_LVL[id]){toast('Vrij op niveau '+BG_LVL[id]);return;}if(S.coins<b.p){toast('Niet genoeg munten');return;}S.coins-=b.p;S.bgs.push(id);addXP(10);sfx('buy');}
  T().bg=id;SAND=sandLine();updTop();save();shop('bg');};
window.buyDecor=id=>{const d=DECOR.find(q=>q.id===id),l=DECOR_LVL[id]||1;if(S.lvl<l){toast('Vrij op niveau '+l);return;}if(S.coins<d.p){toast('Niet genoeg munten');return;}if(T().decor.length>=10){toast('Max. 10 decoraties per zee');return;}
  S.coins-=d.p;T().decor.push({id,x:.08+Math.random()*.84});track('buydecor');addXP(4);updTop();save();close();sfx('buy');toast(d.n+' geplaatst – verschuif met ✋ Inrichten');};
window.buySea=i=>{if(i<S.tanks.length){switchSea(i);close();return;}const z=CFG.seas[i];
  if(i!==S.tanks.length){toast('Koop eerst '+CFG.seas[S.tanks.length].n);return;}if(S.lvl<z.lvl){toast('Vrij op niveau '+z.lvl);return;}if(S.coins<z.p){toast('Niet genoeg munten');return;}
  S.coins-=z.p;const t=newTank(pick(S.bgs));t.fish=[mkFish(catalogFish()[rnd(4)].g,false)];S.tanks.push(t);addXP(25);switchSea(i);close();sfx('new');toast(z.n+' is van jou!');};
function switchSea(i){S.cur=(i+S.tanks.length)%S.tanks.length;SAND=sandLine();food.length=0;drops.length=0;syncSwimmers(true);updTop();save();}
$('seaPrev').onclick=()=>switchSea(S.cur-1);$('seaNext').onclick=()=>switchSea(S.cur+1);

// evolutie: vis in het midden, twee uitkomsten, Start / Opnieuw kiezen
let evoPick=0;
function evoUI(fid){
  if(S.evo){ // lopende evolutie
    const e=S.evo,tk=S.tanks[e.tank],f=tk&&tk.fish.find(q=>q.id===e.id);
    if(!f){S.evo=null;return evoUI();}
    const left=Math.max(0,e.done-Date.now()),ready=left<=0;
    open(hd('Evolutie')+`<div class="two"><canvas class="big" id="evoT"></canvas><div style="text-align:center"><p>${fname(f.g)} wordt…</p>
      <div style="font-weight:900;font-size:18px">${fname(e.g)}</div>
      <p style="font-size:20px;font-weight:900;color:var(--ink)">${ready?'Klaar!':'⏱ '+fmtT(left/1000)}</p>
      ${ready?'<button class="btn p" onclick="finishEvo()">Bekijk je nieuwe vis</button>':`<button class="btn p" ${S.pearls<CFG.skipPearls?'disabled':''} onclick="skipEvo()">Direct klaar (${CFG.skipPearls} parels)</button><button class="btn" onclick="closeM()">Wachten</button>`}</div></div>`);
    liveSil('evoT',e.g,!ready);
    if(!ready)setTimeout(()=>{if(modalOpen()&&$('evoT'))evoUI();},1000);
    return;
  }
  const t=T(),cands=t.fish.filter(f=>evoOptions(f));
  if(!fid){
    if(!cands.length){open(hd('Evolutie')+'<p>Je hebt een volwassen vis nodig die nog niet volledig geëvolueerd is. Voer je vissen tot ze volwassen zijn.</p><button class="btn p" onclick="closeM()">Oké</button>');return;}
    open(hd('Evolutie')+`<p>Kies een vis. Elke vis kan naar één van twee nieuwe vormen evolueren – en daarna nog één keer.</p>
      <div class="grid">${cands.map(f=>`<div class="item" onclick="evoUI('${f.id}')"><span class="tag r${rarity(f.g)}">Vorm ${(f.tier||0)+1}</span><div style="font-size:11px">${fname(f.g)}</div></div>`).join('')}</div>`);
    mount('.item',cands.map(f=>thumb(f.g,90,66)));return;
  }
  const f=t.fish.find(q=>q.id===fid);if(!f)return evoUI();
  const opts=evoOptions(f);if(!opts){toast('Deze vis kan niet (verder) evolueren');return evoUI();}
  const tier=f.tier||0,cost=CFG.evoCost[tier],time=CFG.evoTime[tier];
  open(hd('Evolutie')+`<div style="display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;align-items:center;text-align:center">
      ${opts.map((g,i)=>`${i===1?`<div><canvas id="evoC" class="mid"></canvas><div style="font-weight:900;font-size:12px">${fname(f.g)}</div></div>`:''}
        <div class="item ${evoPick===i?'sel':''}" onclick="evoPick=${i};evoUI('${fid}')"><canvas id="evo${i}" class="mid"></canvas>
        <div style="font-size:11px">${fname(g)}</div>${rt(rarity(g))}<div style="font-size:11px;color:var(--muted);margin-top:4px">⏱ ${fmtT(time)}</div></div>`).join('')}
    </div>
    <p style="text-align:center;margin-top:10px">Kies een uitkomst. Kosten: <b>${cost} munten</b>.</p>
    <div class="row2"><button class="btn" onclick="evoPick=0;evoUI()">Opnieuw kiezen</button><button class="btn p" ${S.coins<cost?'disabled':''} onclick="startEvo('${fid}')">Start</button></div>`);
  liveFish('evoC',f.g,140,116,74);opts.forEach((g,i)=>liveFish('evo'+i,g,120,100,60));
}
window.evoPick=0;
Object.defineProperty(window,'evoPick',{get:()=>evoPick,set:v=>{evoPick=v;}});
window.evoUI=evoUI;
function liveSil(id,g,sil){const c=$(id),d=2;c.width=280*d;c.height=200*d;const x=c.getContext('2d');x.scale(d,d);
  const loop=()=>{if(!modalOpen()||!$(id))return;x.clearRect(0,0,280,200);x.filter=sil?'brightness(0) opacity(.35)':'none';drawFish(x,g,140,104,150,performance.now()/160,1);x.filter='none';requestAnimationFrame(loop);};loop();}
function fmtT(s){s=Math.ceil(s);return s>=60?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':s+'s';}
window.startEvo=fid=>{const f=T().fish.find(q=>q.id===fid);if(!f)return;const tier=f.tier||0,cost=CFG.evoCost[tier];if(S.coins<cost){toast('Niet genoeg munten');return;}
  const g=evoOptions(f)[evoPick];S.coins-=cost;S.evo={id:f.id,tank:S.cur,g,done:Date.now()+CFG.evoTime[tier]*1000,ready:false};evoPick=0;updTop();save();sfx('love');evoUI();};
window.skipEvo=()=>{if(!S.evo||S.pearls<CFG.skipPearls)return;S.pearls-=CFG.skipPearls;S.evo.done=Date.now();S.evo.ready=true;save();evoUI();};
window.finishEvo=()=>{const e=S.evo;if(!e)return;const tk=S.tanks[e.tank],f=tk&&tk.fish.find(q=>q.id===e.id);S.evo=null;
  if(!f){updTop();close();return;}
  f.g=e.g;f.tier=(f.tier||0)+1;const k=key(f.g),isNew=!S.disc[k];S.disc[k]=1;if(isNew)track('discover');track('evolve');S.stats.evolved++;addXP(20+f.tier*15);
  updTop();save();sfx(isNew?'new':'hatch');
  open(`<div class="two"><canvas class="big reveal" id="bigc"></canvas><div style="text-align:center"><h2>${isNew?'Nieuwe soort ontdekt!':'Geëvolueerd!'}</h2>
    <div style="font-weight:900;font-size:18px;margin:6px 0">${fname(f.g)}</div>${rt(rarity(f.g))}${isNew?'<span class="new">NIEUW</span>':''}
    <p>${Object.keys(S.disc).length} van ${total()} soorten ontdekt</p><button class="btn p" onclick="closeM()">Prachtig!</button></div></div>`);
  liveFish('bigc',f.g,280,200,150);};

// taken

// jackpot
const SYM=['🐟','🐚','🪙','⭐','🦀','💎'],JPK=['fish','shell','coin','star','crab','gem'];
const symHTML=i=>UIA['jp_'+JPK[i]]?`<img src="art/jp_${JPK[i]}.png" style="width:58px;height:58px;object-fit:contain" alt="">`:SYM[i];
function jackpotUI(){
  const free=S.jackDay!==today();
  open(hd('Jackpot')+`<p>Drie dezelfde? Prijs! Drie diamanten is de <b>jackpot</b> (500 munten).</p>
    <div id="reels" style="display:flex;gap:8px;justify-content:center;margin:8px 0">${[0,1,2].map(()=>`<div style="width:72px;height:76px;border-radius:14px;background:#123247;display:grid;place-items:center;font-size:40px">❔</div>`).join('')}</div>
    <div class="kv" style="justify-content:center;gap:14px;align-items:center"><span style="display:flex;align-items:center;gap:3px">3× ${symHTML(5).replace(/58px/g,'22px')} = 500</span><span style="display:flex;align-items:center;gap:3px">3× ${symHTML(3).replace(/58px/g,'22px')} = 150</span><span>3× = 60</span><span>2× = 12</span></div>
    <button class="btn p" id="spin" onclick="spin()">${free?'Gratis draaien (vandaag)':'Draaien ('+CFG.jackpotCost+' munten)'}</button>`);
}
const today=()=>new Date().toISOString().slice(0,10);
let spinning=false;
window.spin=()=>{if(spinning)return;const free=S.jackDay!==today();if(!free){if(S.coins<CFG.jackpotCost){toast('Niet genoeg munten');return;}S.coins-=CFG.jackpotCost;}
  S.jackDay=today();spinning=true;track('jackpot');S.stats.spins=(S.stats.spins||0)+1;updTop();
  const w=[30,24,22,12,10,4],pickW=()=>{let r=Math.random()*100;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}return 0;};
  let res=[pickW(),pickW(),pickW()];if(Math.random()<.18)res[1]=res[0];if(Math.random()<.08)res[2]=res[0];
  const cells=[...$('reels').children];let n=0;
  const iv=setInterval(()=>{n++;cells.forEach((c,i)=>{c.innerHTML=symHTML(n<8+i*5?rnd(SYM.length):res[i]);});tone(400+n*20,.03,'square',.03);
    if(n>=18){clearInterval(iv);spinning=false;
      let win=0;const [a,b,c]=res;if(a===b&&b===c)win=a===5?500:a===3?150:60;else if(a===b||b===c||a===c)win=12;
      if(a===5&&b===5&&c===5)S.stats.jackpots=(S.stats.jackpots||0)+1;if(win){S.coins+=win;sfx(win>=150?'new':'coin');toast(win>=500?'💎 JACKPOT! +500':'+'+win+' munten');}else toast('Helaas, nog eens?');
      addXP(2);updTop();save();$('spin').textContent='Draaien ('+CFG.jackpotCost+' munten)';}},70);};

// trofeeën: alle soorten die je ooit had

  const ks=Object.keys(S.disc),list=ks.map(k=>fishG(parseInt(k.slice(1)),k.slice(1).replace(/^\d+/,''))).filter(g=>artImg(g)).sort((a,b)=>rarity(b)-rarity(a)||a.a-b.a);

// ================= stamboom: per familie basis → a/b → aa/ab/ba/bb =================
const PATHS=['','a','b','aa','ab','ba','bb'];
const famIdx=()=>ART_FISH.map((x,k)=>x?k:-1).filter(k=>k>=0);
const famName=a=>{const i=ART_NAMES[artFile(a,'')];return (i&&i.familienaam)||('Familie '+(a+1));};
const famHave=a=>PATHS.filter(p=>(p?ART_EVO[a]&&ART_EVO[a][p]:ART_FISH[a])).filter(p=>S.disc[key(fishG(a,p))]).length;
const famSize=a=>PATHS.filter(p=>p?ART_EVO[a]&&ART_EVO[a][p]:ART_FISH[a]).length;
const famDone=a=>famSize(a)===7&&famHave(a)===7;
function silThumb(g,w,h){const c=thumb(g,w,h),x=c.getContext('2d');x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(23,56,74,.82)';x.fillRect(0,0,c.width,c.height);x.restore();return c;}
let treeFam=0;
function stamboomUI(a){
  const fams=famIdx();if(!fams.length){toast('Vissen worden nog geladen');return;}
  if(a!=null)treeFam=a;if(!fams.includes(treeFam))treeFam=fams[0];a=treeFam;
  const tot=fams.reduce((n,k)=>n+famHave(k),0),max=fams.reduce((n,k)=>n+famSize(k),0),full=fams.filter(famDone).length;
  const node=p=>{const g=fishG(a,p),has=!!S.disc[key(g)];
    return `<div class="tnode ${has?'':'unk'}" data-p="${p}"><div class="tn">${has?fname(g):'???'}</div>${has?rt(rarity(g)):`<span class="tq">${p.length===0?'Koop in de winkel':'Evolueer '+(p.length===1?fname(fishG(a,'')):(S.disc[key(fishG(a,p[0]))]?fname(fishG(a,p[0])):'???'))}</span>`}</div>`;};
  open(hd('Stamboom')+`<div class="tchips">${fams.map(k=>`<button class="tchip ${k===a?'on':''} ${famDone(k)?'done':''}" onclick="stamboomUI(${k})" aria-label="${famName(k)}"><span class="tc" data-a="${k}"></span><b>${famHave(k)}/${famSize(k)}</b></button>`).join('')}</div>

    ${SLOTS.length<MAX_SLOTS?`<button class="btn p" onclick="slotNew()">+ Nieuwe oceaan</button>`:`<p style="text-align:center;margin-top:8px">Maximaal ${MAX_SLOTS} oceanen.</p>`}`);
  const inp=$('slotName');if(inp){inp.focus();inp.select();inp.onkeydown=e=>{if(e.key==='Enter')slotSave(slotEdit);};}
};
Object.defineProperty(window,'slotEdit',{get:()=>slotEdit,set:v=>{slotEdit=v;slotDel=null;}});
window.slotSave=id=>{const v=($('slotName')||{}).value;const sl=SLOTS.find(x=>x.id===id);if(sl&&v&&v.trim())sl.name=v.trim().slice(0,24);slotEdit=null;store.set('slots',SLOTS);slotsUI();};
window.slotPlay=id=>{save();CUR=id;store.set('cur',CUR);resetting=true;location.reload();};
window.slotNew=()=>{if(SLOTS.length>=MAX_SLOTS)return;save();let n=1;while(SLOTS.find(x=>x.id==='s'+n))n++;
  const id='s'+n,name='Oceaan '+(SLOTS.length+1);SLOTS.push({id,name});store.set('slots',SLOTS);CUR=id;store.set('cur',CUR);resetting=true;location.reload();};
window.slotDelete=id=>{if(SLOTS.length<=1)return;if(slotDel!==id){slotDel=id;slotsUI();return;}
  try{localStorage.removeItem('fish4u_state_'+id);}catch(e){}SLOTS=SLOTS.filter(x=>x.id!==id);store.set('slots',SLOTS);slotDel=null;
  if(id===CUR){CUR=SLOTS[0].id;store.set('cur',CUR);resetting=true;location.reload();return;}slotsUI();};
let confirmReset=0,resetting=false;
window.resetGame=btn=>{
  if(!confirmReset){confirmReset=1;btn.textContent='Zeker weten? Tik nogmaals';return;}
  resetting=true;try{localStorage.removeItem('fish4u_state_'+CUR);}catch(e){}location.reload();
};
window.jackpotUI=jackpotUI;window.trophies=()=>stamboomUI();window.tasksUI=tasksUI;window.closeM=close;
$('bShop').onclick=()=>{ensureAudio();shop();};
$('bEvo').onclick=()=>{ensureAudio();evoUI();};
$('bMore').onclick=()=>{ensureAudio();moreUI();};
$('bTasks').onclick=()=>{ensureAudio();tasksUI();};
$('bPearls').onclick=()=>{ensureAudio();pearlsUI();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else lastT=performance.now();});
addEventListener('pagehide',save);
['gesturestart','gesturechange','gestureend','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));

/* ================= geluid ================= */
let AC=null;
function ensureAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}}if(AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,slide,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function sfx(k){if(S&&S.sound===false)return;switch(k){
  case 'clean':tone(900,.05,'triangle',.04,1.6);break;
  case 'xp':tone(1400,.08,'sine',.05,1.3);break;
  case 'plop':tone(520,.08,'sine',.06,.5);break;
  case 'munch':tone(300,.05,'triangle',.05,1.4);break;
  case 'coin':tone(1175,.06,'sine',.06);tone(1568,.12,'sine',.06,1,.05);break;
  case 'buy':tone(660,.08,'sine',.06);tone(990,.12,'sine',.06,1,.07);break;
  case 'grow':[523,659,784].forEach((f,i)=>tone(f,.12,'triangle',.06,1,i*.08));break;
  case 'love':tone(784,.15,'sine',.06);tone(988,.2,'sine',.06,1,.12);break;
  case 'hatch':tone(400,.1,'triangle',.06,2);tone(800,.15,'sine',.05,1,.1);break;
  case 'new':[523,659,784,1047,1319].forEach((f,i)=>tone(f,.14,'triangle',.06,1,i*.09));break;}}

/* ================= start ================= */
resize();syncSwimmers(true);updTop();setTool('pointer');
G4U_ART_SERIES('art/','vis_',99,(i,img)=>{ART_FISH[i]=img;updTop();
  const ev=ART_EVO[i]={};G4U_ART('art/',['a','b','aa','ab','ba','bb'].map(p=>artFile(i,p)),{},(n,im)=>{ev[n.slice(6)]=im;});}).then(cleanup);
G4U_JSON('art/vissen.json').then(j=>{if(Array.isArray(j))j.forEach(v=>{if(v&&v.bestand)ART_NAMES[v.bestand.replace(/\.png$/,'')]=v;});});
// oude spellen opschonen: oude zelfgetekende vissen worden getekende babyvissen
function cleanup(){
  if(!ART_FISH.length)return;let changed=false;
  for(const t of S.tanks)for(const f of t.fish){
    if(f.g.a==null||f.g.a>=ART_FISH.length||'s' in f.g){const have=ART_FISH.map((x,k)=>x?k:-1).filter(k=>k>=0);const a=f.g.a!=null&&f.g.a<ART_FISH.length?f.g.a:have[rnd(have.length)];f.g=fishG(a,f.g.a!=null?(f.g.path||''):'');changed=true;}
    f.tier=(f.g.path||'').length;
  }
  if(S.evo&&(!S.evo.g||S.evo.g.a==null||'s' in S.evo.g)){S.evo=null;changed=true;}
  const d={};for(const k of Object.keys(S.disc)){if(k[0]==='A'){const m=k.match(/^A(\d+)([ab]*)/);if(m)d['A'+m[1]+m[2]]=1;}}
  for(const t of S.tanks)for(const f of t.fish)d[key(f.g)]=1;
  if(Object.keys(d).length!==Object.keys(S.disc).length)changed=true;S.disc=d;
  if(changed){syncSwimmers(true);save();}updTop();
}
G4U_ART('art/',DECOR_IDS.map(i=>'decor_'+i),{},(n,i)=>{DECOR_ART[n.slice(6)]=i;});
// UI-pakket
const UIA={};
G4U_ART('art/',['ui_pointer','ui_food','ui_clean','ui_decor','ui_shop','ui_evolution','ui_menu','ui_tasks','ui_jackpot','ui_trophy','ui_sea','ui_home','ui_help','ui_settings','ui_tree','ui_games','ui_pearl','jp_fish','jp_shell','jp_coin','jp_star','jp_crab','jp_gem','obj_coin','obj_pearl','obj_xp','obj_food','obj_dirt_1','obj_dirt_2','obj_dirt_3','ach_ontdekken','ach_evolutie','ach_stamboom','ach_verzorging','ach_inrichten','ach_groei','ach_jackpot'],UIA,(n,im)=>{
  const k=n.replace(/^ui_|^obj_/,'');
  document.querySelectorAll('[data-ic="'+k+'"] span').forEach(sp=>{sp.innerHTML='';sp.appendChild(im.cloneNode());});
  document.querySelectorAll('[data-ic2="'+k+'"]').forEach(el=>{const b=el.querySelector('.badge2');el.textContent='';const c=im.cloneNode();c.alt='';
    el.appendChild(c);if(b)el.appendChild(b);});
  if(k==='coin')document.querySelectorAll('.pill:not(.b) i').forEach(i=>{const c=im.cloneNode();c.className='pi';i.replaceWith(c);});
  if(k==='pearl')document.querySelectorAll('.pill.b i').forEach(i=>{const c=im.cloneNode();c.className='pi';i.replaceWith(c);});
});
const uiIc=(k,emo)=>UIA['ui_'+k]?`<img class="uiimg" src="art/ui_${k}.png" alt="">`:(UIA['obj_'+k]?`<img class="uiimg" src="art/obj_${k}.png" alt="">`:`<div style="font-size:26px">${emo}</div>`);
['reef','lagoon','wreck','cave'].forEach(id=>{const im=new Image();im.onload=()=>{BG_ART[id]=im;resize();};im.onerror=()=>G4U_ART('art/',['bg_'+id],{},(n,i)=>{BG_ART[id]=i;resize();});im.src='art/bg_'+id+'.jpg';});
function loop(now){let dt=(now-lastT)/1000;lastT=now;if(dt>.25)dt=.25;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));
</script>
