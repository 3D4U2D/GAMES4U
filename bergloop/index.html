<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">

<title>Bergloop</title>
<link rel="manifest" href="../manifest.webmanifest">

<style>
:root{--dark:#1e1a24;--cream:#fff6e2;--cream2:#f0dcb0;--orange:#ff8a1f;--muted:#8a7a5c}
*{box-sizing:border-box;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1220;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;height:100vh;height:100dvh;width:min(100vw,calc(100dvh * .62));margin:0 auto;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.hud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);display:flex;align-items:flex-start;gap:8px;padding:0 12px;z-index:3;pointer-events:none}
.pbtn{pointer-events:auto;width:42px;height:42px;border:3px solid var(--dark);border-radius:6px;background:var(--orange);display:grid;place-items:center;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35);font-size:18px;font-weight:900;flex:none}
.pbtn.alt{background:#3a4256}
.pbtn svg{width:18px;height:18px}
.stats{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;text-shadow:0 2px 0 var(--dark),2px 0 0 var(--dark),-2px 0 0 var(--dark),0 -2px 0 var(--dark)}
.stats .m{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stats .c{font-size:16px;color:#ffd84a;font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.ov{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;pointer-events:none}
.ov .card,.ov button{pointer-events:auto}
.title{font-size:46px;font-weight:900;color:#fff;text-shadow:0 4px 0 var(--dark),3px 0 0 var(--dark),-3px 0 0 var(--dark),0 -3px 0 var(--dark),3px 4px 0 var(--dark),-3px 4px 0 var(--dark)}
.title em{font-style:normal;color:var(--orange)}
.sub{font-size:15px;font-weight:800;text-shadow:0 2px 0 var(--dark),1px 0 0 var(--dark),-1px 0 0 var(--dark)}
.how{display:grid;grid-template-columns:repeat(3,auto);gap:6px 14px;font-weight:800;font-size:13px;background:rgba(30,26,36,.72);padding:10px 14px;border-radius:10px}
.how span{display:flex;align-items:center;gap:6px}
.how b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#fff;color:var(--dark);font-size:14px}
.tapme{font-size:18px;font-weight:900;text-shadow:0 2px 0 var(--dark),2px 0 0 var(--dark),-2px 0 0 var(--dark),0 -2px 0 var(--dark);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.card{width:min(100%,300px);background:var(--cream);color:var(--dark);border:4px solid var(--dark);border-radius:8px;padding:14px;
  box-shadow:inset -4px -4px 0 var(--cream2),0 6px 0 rgba(0,0,0,.35);animation:up .35s cubic-bezier(.3,1.4,.6,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.card h2{margin:0 0 10px;text-align:center;font-size:26px;font-weight:900;color:var(--orange);text-shadow:2px 2px 0 var(--dark)}
.rows{display:grid;gap:6px}
.rows div{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:13px;text-transform:uppercase;color:var(--muted)}
.rows b{font-size:24px;color:var(--dark);font-variant-numeric:tabular-nums;text-transform:none}
.new{display:inline-block;background:#e8202a;color:#fff;font-size:10px;padding:2px 5px;border-radius:3px;margin-left:4px;vertical-align:middle}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:48px;border:3px solid var(--dark);border-radius:6px;background:#fff;color:var(--dark);font-weight:900;font-size:16px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15),0 4px 0 var(--dark)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dark)}
.btn.primary{background:var(--orange);color:#fff;text-shadow:1px 1px 0 var(--dark)}
ol.top{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol.top li{display:flex;gap:10px;background:#fff;border:2px solid var(--cream2);border-radius:5px;padding:6px 10px;font-weight:900}
ol.top li .r{width:22px;color:var(--muted)}ol.top li .s{flex:1;font-size:17px}ol.top li .d{font-size:12px;color:var(--muted)}
ol.top li:first-child{background:#ffe7a3}
.empty{text-align:center;color:var(--muted);font-weight:800;padding:16px 0}
.banner{position:absolute;left:50%;top:22%;z-index:3;transform:translateX(-50%);background:var(--cream);color:var(--dark);border:3px solid var(--dark);border-radius:6px;
  padding:8px 16px;font-weight:900;font-size:18px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:ban 2.6s ease forwards;pointer-events:none}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-20px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
.flash{position:absolute;inset:0;background:#fff;z-index:2;pointer-events:none;opacity:0}
.flash.go{animation:fl .3s ease-out}@keyframes fl{0%{opacity:.8}100%{opacity:0}}
</style>
</head>

function resize(){

/* ===== achtergrond ===== */
/* ===== bergen/achtergrond per wereld ===== */
let backs=[null,null];
function buildBackdrops(){
  backs=[0,1].map(w=>{
    const c=document.createElement('canvas');c.width=LW*2;c.height=90;const x=c.getContext('2d');
    const rnd=(()=>{let s=w?11:5;return()=>{s=(s*16807)%2147483647;return s/2147483647;};})();
    if(w===0){
      // Alpen: verre grijsblauwe toppen met sneeuw
      for(let layer=0;layer<2;layer++){
        x.fillStyle=layer?'#6f8fb4':'#9fb7d2';
        for(let px=-20;px<LW*2;px+=layer?46:60){
          const h=layer?54+rnd()*24:70+rnd()*16,wd=layer?60:84;
          x.beginPath();x.moveTo(px,90);x.lineTo(px+wd/2,90-h);x.lineTo(px+wd,90);x.fill();

const DV={N:[0,1],E:[1,0],W:[-1,0]},YAW={N:0,E:Math.PI/2,W:-Math.PI/2};
const RIGHT=d=>[DV[d][1],-DV[d][0]];

let genDist=0,genWorld=0,nextWorldGen=600;
function makeSeg(x,z,dir,first){
  const len=first?32:(dir==='N'?16+Math.floor(Math.random()*16):10+Math.floor(Math.random()*8));
  const turn=dir==='N'?(!first&&Math.random()<0.25?'T':(Math.random()<.5?'L':'R')):(dir==='W'?'R':'L');
  const seg={x,z,dir,len,turn,items:[],tiles:{},decor:[],next:null,arms:null,world:genWorld,start:first?0:1};
  const diff=Math.min(1,genDist/3000),W=WORLDS[genWorld];

    const r=Math.random(),gap=(6+Math.random()*5)*(1.25-diff*0.45);
    if(r<0.2){const lat=[-0.55,0,0.55][Math.floor(Math.random()*3)];for(let i=0;i<5&&s+i*0.9<len-3;i++)seg.items.push({t:'coin',s:s+i*0.9,lat});s+=5.5;}
    else if(r<0.42){seg.items.push({t:'low',k:W.low,s});s+=gap;}
    else if(r<0.62){seg.items.push({t:'high',k:W.high,s});s+=gap;}
    else if(r<0.76&&genDist>120){seg.tiles[Math.floor(s)]='gap';s+=gap;}
    else if(r<0.9&&genDist>260&&s+4<len-5){const i=Math.floor(s),k=Math.random()<.5?'nl':'nr';
      for(let j=0;j<3;j++){seg.tiles[i+j]=k;seg.items.push({t:'coin',s:i+j+0.5,lat:k==='nl'?-0.5:0.5});}s+=gap+3;}
    else if(r<0.95&&genDist>200){seg.items.push({t:Math.random()<.5?'magnet':'boost',s,lat:0});s+=6;}
    else s+=3;
  }
  for(let d=0;d<len;d+=2.5+Math.random()*3.5){const side=Math.random()<.5?-1:1;
    seg.decor.push({s:d,lat:side*(2.6+Math.random()*2.6),k:W.decor[Math.floor(Math.random()*3)],y:-0.2-Math.random()*1.6});}
  genDist+=len;if(genDist>=nextWorldGen){genWorld=1-genWorld;nextWorldGen+=600;}
  return seg;
}
function segEnd(sg){const d=DV[sg.dir];return [sg.x+d[0]*sg.len,sg.z+d[1]*sg.len];}
function wpos(sg,s,l){const d=DV[sg.dir],r=RIGHT(sg.dir);return [sg.x+d[0]*s+r[0]*l,sg.z+d[1]*s+r[1]*l];}
function extend(){
  let sg=cur,ahead=cur.len-ps;
  while(ahead<FAR+12){
    if(sg.turn==='T'){if(!sg.arms){const [ex,ez]=segEnd(sg);sg.arms={L:makeSeg(ex,ez,'W'),R:makeSeg(ex,ez,'E')};}break;}
    if(!sg.next){const [ex,ez]=segEnd(sg);sg.next=makeSeg(ex,ez,turnTo(sg.dir,sg.turn));}

}
function solidAt(sg,s,l){
  if(Math.abs(l)>HALF+0.05)return false;

  if(s>sg.len+1)return false;

}

let state='ready',paused=false,overAt=0;
let cur,ps,lat,latT,py,pvy,slideT,dist,coins,speed,yaw,runPhase,deadT,deadKind,chase,chaseT,introT,slowT,magnetT,boostT,pendTurn,partner,worldMix,shownWorld,shake;
function reset(){

  chase=0;chaseT=0;introT=2.6;slowT=0;magnetT=0;boostT=0;pendTurn=null;worldMix=0;shownWorld=0;shake=0;

/* ===== bochten ===== */
function tryTurn(side){
  if(!(ps>=cur.len-3.8&&ps<=cur.len+1.0))return false;
  let nd,ns;
  if(cur.turn==='T'){nd=side==='L'?'W':'E';ns=cur.arms&&cur.arms[side];}
  else{if(cur.turn!==side)return false;nd=turnTo(cur.dir,side);ns=cur.next;}
  if(!ns)return false;
  const [jx,jz]=segEnd(cur),P=wpos(cur,ps,lat),d2=DV[nd],r2=RIGHT(nd),rx=P[0]-jx,rz=P[1]-jz;
  ps=Math.max(0,rx*d2[0]+rz*d2[1]);lat=Math.max(-0.8,Math.min(0.8,rx*r2[0]+rz*r2[1]));latT=hasTilt?latT:0;lat*=0.3;
  cur=ns;extend();sfx('swish');pendTurn=null;
  if(cur.world!==shownWorld){shownWorld=cur.world;banner(WORLDS[shownWorld].name);sfx('world');}
  return true;
}

let sx0=0,sy0=0,st=0,swiped=false;

function act(m){
  if(m==='l'||m==='r'){const side=m==='l'?'L':'R';
    if(!tryTurn(side)){pendTurn={side,t:0.35};if(!hasTilt)latT=Math.max(-0.65,Math.min(0.65,latT+(side==='L'?-0.65:0.65)));}}
  else if(m==='u'&&py<=0.001){pvy=4.4;slideT=0;sfx('jump');partner.q.push({t:0.1,m});}

/* ===== update ===== */
function update(dt){
  runPhase+=dt*(state==='play'?speed*0.9:6);
  if(state==='ready'){introT=2.6;return;}
  if(state==='over')return;
  if(state==='dying'){deadT+=dt;shake=Math.max(0,shake-dt*20);
    if(deadKind==='fall'){pvy-=14*dt;py+=pvy*dt;ps+=speed*0.4*dt;}
    if(deadKind==='caught'){chase=1;}
    if(deadT>1.2)showOver();return;}
  const base=Math.min(18,8+dist/130);
  speed=base*(boostT>0?1.7:1)*(slowT>0?0.65:1);
  const step=speed*dt;ps+=step;dist+=step;
  // zijwaarts: kantelen of vegen
  if(hasTilt)latT=Math.max(-0.85,Math.min(0.85,tilt/20));
  lat+=(latT-lat)*Math.min(1,dt*10);
  // springen/bukken
  if(py>0||pvy>0){pvy-=11*dt;py=Math.max(0,py+pvy*dt);if(py===0)pvy=0;}
  if(slideT>0)slideT-=dt;
  // wachtende bocht
  if(pendTurn){pendTurn.t-=dt;if(tryTurn(pendTurn.side))pendTurn=null;else if(pendTurn&&pendTurn.t<=0)pendTurn=null;}
  if(boostT>0){boostT-=dt;if(ps>=cur.len-0.4){tryTurn(cur.turn==='T'?(Math.random()<.5?'L':'R'):cur.turn);}}
  if(slowT>0)slowT-=dt;if(magnetT>0)magnetT-=dt;if(introT>0)introT-=dt;
  if(chase>0){chaseT-=dt;if(chaseT<=0)chase=0;}
  // van de baan?
  if(ps>cur.len+1.0||(py<=0.001&&boostT<=0&&!solidAt(cur,ps,lat))){die('fall');return;}
  // voorwerpen
  for(const it of cur.items){
    if(it.hit)continue;const dd=it.s-ps;
    if(it.t==='coin'){if((Math.abs(dd)<0.45&&Math.abs(it.lat-lat)<0.45&&py<1.1)||(magnetT>0&&dd>-0.3&&dd<3.5)){it.hit=true;coins++;sfx('coin');}continue;}
    if(Math.abs(dd)>0.32)continue;
    if(it.t==='magnet'||it.t==='boost'){if(Math.abs(it.lat-lat)<0.6){it.hit=true;if(it.t==='magnet')magnetT=10;else boostT=5;sfx('power');}continue;}
    if(boostT>0)continue;
    if(it.t==='low'&&py<0.32){it.hit=true;stumble();if(state!=='play')return;}
    else if(it.t==='high'&&slideT<=0){it.hit=true;die('hit');return;}
  }
  // partner
  const pl=lat>0.35?lat-0.38:lat+0.38;partner.lat+=(pl-partner.lat)*Math.min(1,dt*10);
  for(const q of partner.q)q.t-=dt;
  while(partner.q.length&&partner.q[0].t<=0){const q=partner.q.shift();if(q.m==='u'&&partner.y<=0.001)partner.v=4.4;if(q.m==='d')partner.slide=0.65;}
  if(partner.y>0||partner.v>0){partner.v-=11*dt;partner.y=Math.max(0,partner.y+partner.v*dt);if(partner.y===0)partner.v=0;}
  if(partner.slide>0)partner.slide-=dt;
  updHud();
}
function stumble(){
  if(chase>0){die('caught');return;}
  chase=1;chaseT=8;slowT=0.6;shake=3;sfx('stumble');try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
}
function die(kind){
  state='dying';deadKind=kind;deadT=0;shake=kind==='fall'?0:5;
  if(kind==='fall')pvy=Math.min(pvy,0.5);

/* ===== tekenen ===== */
let camX=0,camZ=0,cY=1,sY=0;
function toCam(wx,wy,wz){const rx=wx-camX,rz=wz-camZ;return [rx*cY-rz*sY,wy,rx*sY+rz*cY];}
function scr(p){return [LW/2+p[0]*F/p[2],HZ+(CH-p[1])*F/p[2]];}
function poly(pts,col){
  const out=[];

function fogc(c,z){const t=Math.min(1,Math.max(0,(z-18)/(FAR-18)));return rgb(mix(c,curFog,t));}
let curFog=[200,220,240];
function tileDraws(sg,from,list){
  const W=WORLDS[sg.world],last=sg.turn?sg.len+1:sg.len;
  for(let i=Math.max(sg.start,from);i<last;i++){

    const A=wpos(sg,i,l0),B=wpos(sg,i,l1),C=wpos(sg,i+1,l1),D=wpos(sg,i+1,l0);
    const ca=toCam(A[0],0,A[1]),cb=toCam(B[0],0,B[1]),cc=toCam(C[0],0,C[1]),cd=toCam(D[0],0,D[1]);
    const zc=(ca[2]+cb[2]+cc[2]+cd[2])/4;if(zc<-1||zc>FAR+2)continue;

      poly([ca,cd,dn(cd),dn(ca)],fogc(mix(side,[0,0,0],0.15),zc));poly([cb,cc,dn(cc),dn(cb)],fogc(mix(side,[0,0,0],0.15),zc));
      poly([ca,cb,dn(cb),dn(ca)],fogc(side,zc));poly([cd,cc,dn(cc),dn(cd)],fogc(side,zc));
      poly([ca,cb,cc,cd],fogc(top,zc));
      // randsteentjes

    list.push({z:c[2],f:()=>drawItem(it,c)});}
  for(const d of sg.decor){if(d.s<from-4)continue;const P=wpos(sg,d.s,d.lat),c=toCam(P[0],d.y,P[1]);if(c[2]<0.5||c[2]>FAR)continue;

}
function bill(img,c,w,h,lift,fitW){b.imageSmoothingEnabled=!!img.__art;try{bill0(img,c,w,h,lift,fitW);}finally{b.imageSmoothingEnabled=false;}}
function bill0(img,c,w,h,lift,fitW){if(img.__art){const r=img.height/img.width;if(fitW)h=w*r;else if(w*r>h)w=h/r;else h=w*r;}
  const [x,y]=scr([c[0],c[1]+(lift||0),c[2]]),ww=w*F/c[2],hh=h*F/c[2];

  if(it.t==='coin'){const sp=Math.abs(Math.cos(performance.now()/180+it.s));const [x,y]=scr([c[0],0.32,c[2]]),s=0.24*F/c[2];

function draw(){

  // spelers + achtervolgers
  if(CHARS){
    const fi=Math.floor(runPhase)%4,P1=wpos(cur,ps,lat),P2=wpos(cur,ps-0.12,partner.lat);
    const c1=toCam(P1[0],0,P1[1]),c2=toCam(P2[0],0,P2[1]);
    const dead=state==='dying'&&deadKind!=='fall'?Math.min(1.3,deadT*3):0;
    list.push({z:c2[2],f:()=>drawGuy(CHARS.p2.back[partner.y>0.05||partner.slide>0?0:(fi+2)%4],P2,state==='dying'&&deadKind==='fall'?py:partner.y,partner.slide>0,-dead*0.5)});
    list.push({z:c1[2]-0.01,f:()=>drawGuy(CHARS.p1.back[py>0.05||slideT>0?0:fi],P1,py,slideT>0,dead)});
  }
  const vis=Math.max(chase,introT>0?1:0,state==='dying'&&deadKind==='caught'?1:0);
  if(vis>0&&state!=='ready'){
    const kind=WORLDS[cur.world].chaser,fr=Math.floor(runPhase*0.8)%2,back=deadKind==='caught'?0.35:1.15;
    for(const l of[-0.6,0,0.6]){const P=wpos(cur,ps-back-(l===0?0.25:0),l*0.9),c=toCam(P[0],0,P[1]);
      if(c[2]>0.35)list.push({z:c[2],f:()=>bill(SP[kind+fr],c,0.5,0.55,Math.abs(Math.sin(runPhase*0.5+l*3))*0.12)});}
  }
  list.sort((p,q)=>q.z-p.z);for(const it of list)it.f();
  // power-up-indicator
  if(magnetT>0||boostT>0){b.fillStyle='rgba(30,26,36,.6)';b.fillRect(4,LH-14,60,10);b.fillStyle=boostT>0?'#4aa8ff':'#e8202a';
    b.fillRect(5,LH-13,58*(boostT>0?boostT/5:magnetT/10),8);}
}
function render(){
  draw();ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*cv.width/LW,(Math.random()-.5)*shake*cv.width/LW);
  ctx.drawImage(buf,0,0,cv.width,cv.height);ctx.restore();shake=Math.max(0,shake-0.3);
}

/* ===== UI ===== */
let lastM=-1,lastC=-1;
function updHud(){const m=Math.floor(dist);if(m!==lastM){$('hm').textContent=m+' m';lastM=m;}if(coins!==lastC){$('hc').textContent='● '+coins;lastC=coins;}}
function banner(txt){const d=document.createElement('div');d.className='banner';d.textContent=txt;app.appendChild(d);setTimeout(()=>d.remove(),2700);}
function start(){reset();state='play';$('startOv').classList.add('hidden');$('stats').classList.remove('hidden');$('spacer').classList.add('hidden');
  $('pauseBtn').classList.remove('hidden');banner(WORLDS[0].name);}
function toReady(){reset();state='ready';['overOv','topOv'].forEach(i=>$(i).classList.add('hidden'));$('startOv').classList.remove('hidden');
  $('stats').classList.add('hidden');$('spacer').classList.remove('hidden');const l=store.get('top',[]);$('startBest').textContent=l.length?'Beste score: '+l[0].score:'';}
function showOver(){state='over';overAt=performance.now();
  const sc=score(),list=store.get('top',[]),prev=list.length?list[0].score:0;
  if(sc>0){list.push({score:sc,m:Math.floor(dist),date:new Date().toISOString()});list.sort((a,c)=>c.score-a.score);store.set('top',list.slice(0,10));}
  $('oT').textContent={fall:'Naar beneden!',hit:'Botsing!',caught:'Ingehaald!'}[deadKind]||'Game over';
  $('oM').textContent=Math.floor(dist)+' m';$('oC').textContent=coins;$('oS').textContent=sc;$('oB').textContent=Math.max(prev,sc);
  $('newBest').classList.toggle('hidden',!(sc>prev));$('overOv').classList.remove('hidden');}
$('againBtn').onclick=()=>{ensureAudio();toReady();};
$('topBtn').onclick=()=>{const l=store.get('top',[]);
  $('topList').innerHTML=l.length?'<ol class="top">'+l.map((x,i)=>`<li><span class="r">${i+1}</span><span class="s">${x.score}</span><span class="d">${x.m} m · ${new Date(x.date).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}</span></li>`).join('')+'</ol>':'<div class="empty">Nog geen scores.</div>';
  $('overOv').classList.add('hidden');$('topOv').classList.remove('hidden');};
$('topBack').onclick=()=>{$('topOv').classList.add('hidden');$('overOv').classList.remove('hidden');};
function togglePause(){if(state!=='play')return;paused=!paused;$('pauseOv').classList.toggle('hidden',!paused);}
$('pauseBtn').onclick=togglePause;$('resumeBtn').onclick=togglePause;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused)togglePause();});
['gesturestart','gesturechange','gestureend','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ===== geluid ===== */
let AC=null,soundOn=store.get('sound',true);
const setSB=()=>{$('soundBtn').textContent=soundOn?'🔊':'🔇';};
$('soundBtn').onclick=()=>{soundOn=!soundOn;store.set('sound',soundOn);setSB();ensureAudio();};
function ensureAudio(){if(!soundOn)return;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}}if(AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,slide,delay){if(!soundOn||!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,v){if(!soundOn||!AC)return;const bb=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=bb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=bb;g.gain.value=v;s.connect(g);g.connect(AC.destination);s.start();}
function sfx(k){switch(k){
  case 'coin':tone(1175,.06,'square',.04);tone(1568,.1,'square',.04,1,.05);break;
  case 'jump':tone(300,.14,'square',.05,2);break;
  case 'slide':noise(.18,.12);break;
  case 'swish':tone(500,.06,'triangle',.04,1.6);break;
  case 'hit':noise(.25,.35);tone(120,.3,'square',.08,.4);break;
  case 'stumble':noise(.15,.25);tone(200,.15,'square',.06,.6);break;
  case 'power':[660,880,1175].forEach((f,i)=>tone(f,.1,'square',.05,1,i*.07));break;
  case 'fall':tone(700,.7,'triangle',.07,.2);break;
  case 'world':[523,659,784,1047].forEach((f,i)=>tone(f,.15,'square',.04,1,i*.09));break;}}


/* ===== loop ===== */
let last=performance.now(),acc=0;const STEP=1/120;
function loop(now){let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;
  if(!paused){acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP;}}
  render();requestAnimationFrame(loop);}
setSB();resize();toReady();requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));
</script>
